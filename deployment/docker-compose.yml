services:
  api:
    build: {context: .., dockerfile: deployment/Dockerfile}
    environment: {BUNDLE_DIR: /models/current, ALLOW_DEV: "${ALLOW_DEV:-0}"}
    volumes: ["../artifacts/models/${MODEL_VERSION:?MODEL_VERSION təyin et}:/models/current:ro"]
    ports: ["8000:8000"]
  ui:
    build: {context: .., dockerfile: deployment/Dockerfile}
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    environment: {API_URL: "http://api:8000"}
    ports: ["8501:8501"]
    depends_on: [api]
