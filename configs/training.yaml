# Sahib: Agent 04 (protokol Agent 01/05 ilə razılaşdırılır)
random_seed: 42
cv_folds: 5
primary_metrics: [roc_auc, pr_auc]
holdout_size: 0.2
id_col: sk_id_curr
target_col: target
# decisions/0002: model feature_names-də olmur (processed-də qalır)
excluded_protected_features: [code_gender]
train_data: data/processed/application_train.parquet
models_dir: artifacts/models
use_ft: true   # 03-ün 23 ft_ feature-ı (src.features)
# Tuning (yalnız train hissəsində CV; holdout istifadə olunmur). Seed 42, ParameterSampler.
tuning:
  model: xgb            # GPU-da sürətli (device: auto); LightGBM üçün CPU
  n_trials: 10
  space:
    max_depth: [3, 4, 5, 6, 8]
    learning_rate: [0.02, 0.03, 0.05]
    n_estimators: [400, 600, 900]
    min_child_weight: [10, 20, 50, 100]
    colsample_bytree: [0.3, 0.5, 0.7]
    reg_lambda: [1, 5, 20]
  class_weight_options: [null, balanced]   # resampling-siz imbalance müqayisəsi
# Tuning nəticəsi seçildikdən sonra bura yazılır (benchmark.make oxuyur):
model_params: {}
# decisions/0003: bureau_balance-dən törəyən sütunlar default xaric (train 35% vs test 100% əhatə sürüşməsi)
excluded_drift_prefixes: [bureau_months_, bureau_dpd_, bureau_has_bb_sum]
device: auto   # auto|cpu|cuda (XGBoost/CatBoost GPU; LightGBM/RF CPU). OOF müqayisəsi eyni device-da
